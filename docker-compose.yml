# Mini Distributed Object Store: 1 controller + 4 workers (architecture §6).
#
#   docker compose up -d --build        build the image and start everything
#   curl -s localhost:8080/cluster      see worker states
#   docker stop worker2 / docker start worker2   failure demo
#   docker compose down                 stop (volumes and data are KEPT)
#   docker compose down -v              stop and DELETE all data (factory reset)
#
# Container names are the spec's (controller, worker1..worker4) so that
# `docker stop worker2` works as written. Container names are global on a
# Docker host: if another project already uses them, set
# OBJSTORE_CONTAINER_PREFIX (e.g. "objstore-") and use prefixed names in the
# demo commands. Volumes are namespaced by the project name (objstore_*).
#
# Every setting has a default; override via environment or a .env file
# (see .env.example).

name: objstore

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-worker: &worker
  image: ${OBJSTORE_IMAGE:-objstore:dev}
  command: ["worker"]
  restart: "no" # a deliberately stopped worker stays stopped during demos
  depends_on: [] # workers retry registration; startup order does not matter
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 5s

x-worker-env: &worker-env
  <<: *common-env
  CONTROLLER_URL: http://controller:8080
  DATA_DIR: /data
  CHUNK_SIZE: ${CHUNK_SIZE:-1000000}
  FSYNC_ON_WRITE: ${FSYNC_ON_WRITE:-true}
  MAX_CONCURRENT_READS: ${MAX_CONCURRENT_READS:-16}
  SCRUB_INTERVAL: ${SCRUB_INTERVAL:-10m}

services:
  controller:
    image: ${OBJSTORE_IMAGE:-objstore:dev}
    build:
      context: .
    container_name: ${OBJSTORE_CONTAINER_PREFIX:-}controller
    command: ["controller"]
    restart: "no"
    ports:
      # Bound to loopback: the API is unauthenticated (architecture §5.10).
      - "127.0.0.1:${CONTROLLER_PORT:-8080}:8080"
    environment:
      <<: *common-env
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-3s}
      DEAD_AFTER: ${DEAD_AFTER:-10s}
      REPAIR_GRACE: ${REPAIR_GRACE:-30s}
      FAILURE_CHECK_INTERVAL: ${FAILURE_CHECK_INTERVAL:-1s}
      DB_PATH: /data/meta.db
      # Same variable as the workers' CHUNK_SIZE, so they cannot disagree.
      CHUNK_SIZE: ${CHUNK_SIZE:-1000000}
      REPLICATION_FACTOR: ${REPLICATION_FACTOR:-2}
      UPLOAD_WINDOW: ${UPLOAD_WINDOW:-4}
      MAX_OBJECT_SIZE: ${MAX_OBJECT_SIZE:-5368709120}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-16}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-32}
      PLACEMENT_MIN_FREE_BYTES: ${PLACEMENT_MIN_FREE_BYTES:-100000000}
      WORKER_CONNECT_TIMEOUT: ${WORKER_CONNECT_TIMEOUT:-2s}
      WORKER_REQUEST_TIMEOUT: ${WORKER_REQUEST_TIMEOUT:-10s}
      CLIENT_READ_TIMEOUT: ${CLIENT_READ_TIMEOUT:-60s}
      JANITOR_INTERVAL: ${JANITOR_INTERVAL:-10s}
      RECONCILER_INTERVAL: ${RECONCILER_INTERVAL:-5s}
      MAX_CONCURRENT_REPAIRS: ${MAX_CONCURRENT_REPAIRS:-4}
      UPLOAD_STALE_AFTER: ${UPLOAD_STALE_AFTER:-10m}
      INVENTORY_SWEEP_INTERVAL: ${INVENTORY_SWEEP_INTERVAL:-5m}
    volumes:
      - controller-data:/data # metadata database (DB_PATH)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s

  worker1:
    <<: *worker
    container_name: ${OBJSTORE_CONTAINER_PREFIX:-}worker1
    environment:
      <<: *worker-env
      WORKER_ID: worker1
      ADVERTISE_ADDR: http://worker1:9000
    volumes:
      - worker1-data:/data

  worker2:
    <<: *worker
    container_name: ${OBJSTORE_CONTAINER_PREFIX:-}worker2
    environment:
      <<: *worker-env
      WORKER_ID: worker2
      ADVERTISE_ADDR: http://worker2:9000
    volumes:
      - worker2-data:/data

  worker3:
    <<: *worker
    container_name: ${OBJSTORE_CONTAINER_PREFIX:-}worker3
    environment:
      <<: *worker-env
      WORKER_ID: worker3
      ADVERTISE_ADDR: http://worker3:9000
    volumes:
      - worker3-data:/data

  worker4:
    <<: *worker
    container_name: ${OBJSTORE_CONTAINER_PREFIX:-}worker4
    environment:
      <<: *worker-env
      WORKER_ID: worker4
      ADVERTISE_ADDR: http://worker4:9000
    volumes:
      - worker4-data:/data

  # Optional client container (spec: "1 or more clients"). Not started by
  # `up`; run commands with:
  #   docker compose run --rm client list
  #   docker compose run --rm -v "$PWD:/work" client upload /work/file.bin
  client:
    image: ${OBJSTORE_IMAGE:-objstore:dev}
    profiles: ["tools"]
    entrypoint: ["objctl"]
    environment:
      OBJSTORE_URL: http://controller:8080
    working_dir: /tmp
    restart: "no"

volumes:
  controller-data:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data:
